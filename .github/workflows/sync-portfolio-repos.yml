name: Sync GitHub Portfolio Projects

on:
  schedule:
    # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-projects:
    name: Discover & Sync #portfolio Repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run GitHub Projects Sync Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:github

      - name: Run verification tests
        run: npm test

      - name: Commit and push changes if updated
        run: |
          if [ -n "$(git status --porcelain src/data/github-projects.generated.json)" ]; then
            echo "Changes detected in src/data/github-projects.generated.json. Committing..."
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add src/data/github-projects.generated.json
            git commit -m "chore(sync): update latest github projects with #portfolio tag [skip ci]"
            git push
          else
            echo "No changes detected in discovered GitHub projects."
          fi
